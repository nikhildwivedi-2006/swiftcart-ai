name: SwiftCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Spring Boot application
        working-directory: SwiftCartApp
        run: ./mvnw clean package -DskipTests

      - name: Build Docker image
        run: docker build -t swiftcart-backend:latest ./SwiftCartApp

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag swiftcart-backend:latest nikhilcicd/swiftcart-backend:latest

      - name: Push image to Docker Hub
        run: docker push nikhilcicd/swiftcart-backend:latest

      - name: Build frontend Docker image
        run: docker build -t swiftcart-frontend:latest ./frontend

      - name: Tag frontend Docker image
        run: docker tag swiftcart-frontend:latest nikhilcicd/swiftcart-frontend:latest

      - name: Push frontend image to Docker Hub
        run: docker push nikhilcicd/swiftcart-frontend:latest

       deploy:
    needs: backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/swiftcart
            docker compose pull
            docker compose up -d
