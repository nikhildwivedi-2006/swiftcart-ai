services:
  mysql:
    image: mysql:8
    container_name: swiftcart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: ai_ecommerece
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./SwiftCartApp
    container_name: swiftcart-backend
    depends_on:
      - mysql
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_ecommerece
      DB_USERNAME: root
      DB_PASSWORD: 1234
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

  frontend:
    build:
      context: ./frontend
    container_name: swiftcart-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
